[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aimo-gateway"
version = "0.1.0"
description = "Trusted purchasing gateway for the synthetic Valio Aimo challenge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.35,<1",
  "httpx>=0.28,<1",
  "jsonschema[format]>=4.25,<5",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1", "playwright>=1.55,<2"]

[project.scripts]
aimo-gateway = "aimo_gateway.cli:main"

[project.urls]
Repository = "https://github.com/Krish-Waghresha/valio-aimo"
Demo = "https://www.youtube.com/watch?v=CB_NcgdgK5k"

[tool.hatch.build.targets.wheel]
packages = ["src/aimo_gateway"]

[tool.hatch.build.targets.wheel.force-include]
"docs/gateway.openapi.json" = "aimo_gateway/gateway.openapi.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]