<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open to Agents - cinematic renderer</title>
<style>
  @font-face { font-family: "Barlow Condensed"; src: url("../../src/aimo_gateway/static/fonts/barlow-condensed-700.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "DM Sans"; src: url("../../src/aimo_gateway/static/fonts/dm-sans-400.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "DM Sans"; src: url("../../src/aimo_gateway/static/fonts/dm-sans-700.woff2") format("woff2"); font-weight: 700; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #020b0e; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="film" width="1920" height="1080" aria-label="Open to Agents cinematic film"></canvas>
<script src="motion.js"></script>
<script>
  const canvas = document.getElementById("film");
  const ctx = canvas.getContext("2d", {alpha: false});
  const WIDTH = 1920, HEIGHT = 1080, SOURCE_FPS = 30;
  const C = {ink: "#020b0e", lime: "#c0e021", teal: "#005670", muted: "#a8c6d0"};
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const ease = (x) => { x = clamp(x); return x * x * x * (x * (x * 6 - 15) + 10); };
  const lerp = (a, b, p) => a + (b - a) * p;
  const mix = (a, b, p) => a.map((v, i) => lerp(v, b[i], p));
  const imageCache = new Map();
  let film;

  function keyframes(frames, p) {
    if (p <= frames[0][0]) return frames[0][1];
    for (let i = 1; i < frames.length; i++) {
      if (p <= frames[i][0]) {
        const [a, from] = frames[i - 1], [b, to] = frames[i];
        return mix(from, to, ease((p - a) / (b - a)));
      }
    }
    return frames[frames.length - 1][1];
  }

  async function recordingFrame(segment, localTime) {
    const visual = segment.visual;
    const p = clamp(localTime / segment.duration);
    const sourceTime = lerp(visual.sourceStart, visual.sourceEnd, p);
    const frame = Math.floor(sourceTime * SOURCE_FPS);
    const url = `../build/rec/${visual.rec}/${String(frame).padStart(5, "0")}.jpg`;
    if (imageCache.has(url)) {
      const existing = imageCache.get(url);
      imageCache.delete(url);
      imageCache.set(url, existing);
      return existing;
    }
    const image = new Image();
    image.src = url;
    await image.decode();
    if (!image.naturalWidth || !image.naturalHeight) throw new Error(`Empty recording frame: ${url}`);
    imageCache.set(url, image);
    while (imageCache.size > 16) imageCache.delete(imageCache.keys().next().value);
    return image;
  }

  function roundRect(context, x, y, w, h, r) {
    context.beginPath();
    context.roundRect(x, y, w, h, r);
  }

  function text(str, x, y, size, color = "#fff", font = "DM Sans", weight = 400, align = "left") {
    ctx.font = `${weight} ${size}px "${font}"`;
    ctx.textAlign = align;
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  const FULL_STAGE = [110, 172, 1700, 722];
  const SIDE_STAGE = [468, 180, 1342, 715];
  const DECISION_STAGE = [1030, 200, 780, 675];
  const ORDER_STAGE = [1140, 174, 670, 720];
  const OVERVIEW = [145, 68, 1260, 625];
  const REQUEST = [152, 120, 920, 500];
  const UNDERSTOOD = [166, 211, 900, 478];
  const OPTIONS = [164, 243, 866, 372];
  const DECISION = [1033, 126, 338, 292];
  const AUDIT = [166, 331, 862, 340];

  function camera(segment, p) {
    let crop = OVERVIEW, stage = FULL_STAGE, rail = null, railOpacity = 1;
    if (segment.id === "s09") {
      stage = SIDE_STAGE;
      crop = keyframes([[0, [125, 45, 1250, 665]], [.35, REQUEST], [1, REQUEST]], p);
      rail = ["1,000 L", "Lactose-free milk", "By Monday."];
    } else if (segment.id === "s10") {
      stage = keyframes([[0, SIDE_STAGE], [.24, FULL_STAGE], [1, FULL_STAGE]], p);
      crop = keyframes([[0, REQUEST], [.35, UNDERSTOOD], [.82, UNDERSTOOD], [1, OVERVIEW]], p);
    } else if (segment.id === "s11") {
      crop = keyframes([[0, OVERVIEW], [.5, [166, 110, 1190, 520]], [1, OVERVIEW]], p);
    } else if (segment.id === "s12") {
      crop = keyframes([[0, OVERVIEW], [.19, OPTIONS], [.77, OPTIONS], [1, OVERVIEW]], p);
    } else if (segment.id === "s13") {
      stage = keyframes([[0, FULL_STAGE], [.5, DECISION_STAGE], [1, DECISION_STAGE]], p);
      crop = keyframes([[0, OVERVIEW], [.5, DECISION], [1, DECISION]], p);
      rail = ["€1,150", "Agent authority: €500", "Human approval required."];
      railOpacity = ease((p - .36) / .14);
    } else if (segment.id === "s14") {
      stage = keyframes([[0, DECISION_STAGE], [.42, DECISION_STAGE], [.72, FULL_STAGE], [1, FULL_STAGE]], p);
      crop = keyframes([[0, DECISION], [.42, DECISION], [.72, AUDIT], [1, AUDIT]], p);
      rail = ["One basket.", "One human decision.", "Then price and stock rechecked."];
      railOpacity = 1 - ease((p - .37) / .1);
    } else if (segment.id === "s15") {
      stage = SIDE_STAGE;
      crop = keyframes([[0, [130, 40, 1240, 660]], [.32, REQUEST], [1, UNDERSTOOD]], p);
      rail = ["20 kg", "Butter for Friday.", "An everyday order."];
    } else if (segment.id === "s16") {
      stage = keyframes([[0, SIDE_STAGE], [.2, FULL_STAGE], [.5, FULL_STAGE], [.76, ORDER_STAGE], [1, ORDER_STAGE]], p);
      crop = keyframes([[0, UNDERSTOOD], [.24, OVERVIEW], [.5, OVERVIEW], [.76, [1040, 126, 340, 410]], [1, [1040, 126, 340, 410]]], p);
      rail = ["€42.37", "Within its authority.", "No manager approval needed."];
      railOpacity = ease((p - .66) / .1);
    }
    return {crop, stage, rail, railOpacity};
  }

  function fitCrop(box, image, aspect) {
    let [x, y, w, h] = box;
    const cx = x + w / 2, cy = y + h / 2;
    if (w / h < aspect) w = h * aspect;
    else h = w / aspect;
    const limit = Math.min(1, image.naturalWidth / w, image.naturalHeight / h);
    w *= limit; h *= limit;
    x = clamp(cx - w / 2, 0, image.naturalWidth - w);
    y = clamp(cy - h / 2, 0, image.naturalHeight - h);
    return [x, y, w, h];
  }

  function railLabel(lines, t, segment) {
    const arrive = ease(t / .75);
    ctx.save();
    ctx.globalAlpha *= arrive;
    const x = 112 - (1 - arrive) * 35;
    const broad = segment.id === "s13" || segment.id === "s14" || segment.id === "s16";
    const size = broad ? 102 : 94;
    text(lines[0], x, 404, size, C.lime, "Barlow Condensed", 700);
    text(lines[1], x, 466, broad ? 32 : 27, "#eef5f6");
    text(lines[2], x, 511, broad ? 28 : 25, C.muted);
    ctx.strokeStyle = "#4b6c78"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, 560); ctx.lineTo(x + (broad ? 660 : 280), 560); ctx.stroke();
    text("RECORDED DEMO", x, 602, 19, C.muted, "DM Sans", 700);
    ctx.restore();
  }

  function drawEvidence(image, segment, localTime) {
    const p = clamp(localTime / segment.duration);
    const {crop, stage, rail, railOpacity} = camera(segment, p);
    const [x, y, w, h] = stage;
    const first = segment.id === "s09" || segment.id === "s15";
    const enter = first ? ease(localTime / 1.05) : 1;
    const tilt = first ? (1 - enter) * -.015 : 0;
    const lift = first ? (1 - enter) * 54 : 0;
    if (rail && railOpacity > 0) {
      ctx.save(); ctx.globalAlpha *= railOpacity;
      railLabel(rail, localTime, segment);
      ctx.restore();
    }
    ctx.save();
    ctx.translate(x + w / 2, y + h / 2 + lift);
    ctx.rotate(tilt);
    ctx.scale(.97 + .03 * enter, .97 + .03 * enter);
    ctx.globalAlpha *= .3 + .7 * enter;
    ctx.shadowColor = "#0009"; ctx.shadowBlur = 55; ctx.shadowOffsetY = 30;
    roundRect(ctx, -w / 2, -h / 2, w, h, 22);
    ctx.fillStyle = "#fff"; ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.save();
    roundRect(ctx, -w / 2, -h / 2, w, h, 22); ctx.clip();
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    const [sx, sy, sw, sh] = fitCrop(crop, image, w / h);
    ctx.drawImage(image, sx, sy, sw, sh, -w / 2, -h / 2, w, h);
    ctx.restore();
    const rim = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
    rim.addColorStop(0, "#e1f0cf"); rim.addColorStop(.35, "#6c899555"); rim.addColorStop(1, "#a8c6d0aa");
    roundRect(ctx, -w / 2, -h / 2, w, h, 22);
    ctx.strokeStyle = rim; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }

  function chapter(segment, localTime) {
    if (!segment.chapter) return;
    ctx.save();
    ctx.globalAlpha *= ease((localTime + .1) / .45);
    ctx.fillStyle = C.lime;
    roundRect(ctx, 110, 72, 7, 43, 3); ctx.fill();
    text(segment.chapter, 139, 102, 30, "#fff", "DM Sans", 700);
    text("RECORDED SYNTHETIC SERVICES / MOCK ORDERS", 1810, 100, 17, C.muted, "DM Sans", 700, "right");
    ctx.restore();
  }

  function subtitle(segment, localTime) {
    if (!segment.caption) return;
    const phrase = segment.captions.find(c => localTime >= c.start && localTime < c.end);
    const gradient = ctx.createLinearGradient(0, 926, 0, 1080);
    gradient.addColorStop(0, "#020b0e00"); gradient.addColorStop(.7, "#020b0eef");
    ctx.fillStyle = gradient; ctx.fillRect(0, 926, WIDTH, 154);
    if (!phrase) return;
    text(segment.speaker.toUpperCase(), 120, 999, 21, C.lime, "DM Sans", 700);
    ctx.font = '700 42px "DM Sans"';
    const words = phrase.text.split(" ");
    const lines = [""];
    for (const word of words) {
      const line = lines[lines.length - 1];
      const next = line ? `${line} ${word}` : word;
      if (ctx.measureText(next).width > 1450 && line) lines.push(word);
      else lines[lines.length - 1] = next;
    }
    if (lines.length > 2) throw new Error(`Caption exceeds two lines in ${segment.id}`);
    const baseline = lines.length > 1 ? 978 : 1001;
    for (let i = 0; i < lines.length; i++) text(lines[i], 1055, baseline + i * 49, 42, "#fff", "DM Sans", 700, "center");
  }

  async function drawSegment(segment, localTime, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    if (segment.visual.rec) drawEvidence(await recordingFrame(segment, localTime), segment, localTime);
    else window.CinematicMotion.scene(ctx, segment, localTime, film);
    ctx.restore();
  }

  window.loadFilm = async (value) => {
    film = value;
    if (!film.segments?.length || !Number.isFinite(film.duration)) throw new Error("Invalid film timeline");
    if (!window.CinematicMotion?.scene || !window.CinematicMotion?.background) throw new Error("Motion renderer is missing");
    await Promise.all([
      document.fonts.load('700 80px "Barlow Condensed"'),
      document.fonts.load('400 32px "DM Sans"'),
      document.fonts.load('700 42px "DM Sans"'),
    ]);
    await document.fonts.ready;
    return true;
  };

  window.renderFrame = async (time) => {
    if (!film || !Number.isFinite(time) || time < 0 || time >= film.duration) throw new Error("Frame time outside the film");
    ctx.globalAlpha = 1;
    ctx.fillStyle = C.ink; ctx.fillRect(0, 0, WIDTH, HEIGHT);
    window.CinematicMotion.background(ctx, time);
    let index = film.segments.findLastIndex(s => time >= s.start);
    if (index < 0) index = 0;
    const segment = film.segments[index];
    const local = time - segment.start;
    const previous = film.segments[index - 1];
    const continuous = previous && (
      (segment.visual.rec && segment.visual.rec === previous.visual.rec) ||
      (segment.visual.scene === previous.visual.scene)
    );
    const blend = previous && !continuous ? ease(local / .65) : 1;
    if (previous && blend < 1) await drawSegment(previous, Math.max(0, previous.duration - 1 / film.fps), 1 - blend);
    await drawSegment(segment, local, blend);
    chapter(segment, local);
    subtitle(segment, local);
    const fadeIn = ease(time / .35), fadeOut = ease((film.duration - time) / .45);
    ctx.fillStyle = `rgba(2,11,14,${1 - Math.min(fadeIn, fadeOut)})`;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    return {segment: segment.id, time};
  };
</script>
</body>
</html>
